<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        .wrap {
            width: 200px;
            height: 300px;
            position: relative;
            background-color: greenyellow;
            transition: 0.5s;
            overflow: hidden;
        }
        
        .item {
            width: 100%;
            height: 100%;
            background-color: red;
            position: absolute;
            top: 0;
            left: 0;
        }
        
        .wrap:hover .shadow {
            opacity: 1;
            left: 0;
        }
        
        .shadow {
            background-color: rgba(0, 0, 0, 0.7);
            color: #fff;
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: -200px;
            opacity: 0;
            transition: 0.5s;
        }
    </style>

</head>

<body>


    <div class="wrap">
        <div class="item">
            Lorem ipsum dolor sit amet consectetur, adipisicing elit. Reprehenderit, repellat neque! Cum a laboriosam odit sint quae totam minima voluptatem hic, sed laudantium necessitatibus unde voluptate tempora provident reprehenderit tempore.
        </div>
        <div class="shadow">
            hello
        </div>
    </div>

</body>

</html>
