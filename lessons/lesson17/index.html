<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        circle:hover {
            fill: red;
            stroke-width: 0.5cm
        }
    </style>

</head>

<body>

    <svg style="width: 500px; height: 350px" xmlns="http://www.w3.org/2000/svg">
        <g style="fill-opacity:0.7;">
            <circle cx="300" cy="120" r="100" stroke-width="0.3cm" fill="red" style="stroke:black" />
            <circle cx="370" cy="220" r="100" style="fill:blue; stroke:black; stroke-width:0.1cm" />
            <circle cx="230" cy="220" r="100" style="fill:green; stroke:black; stroke-width:0.1cm" />
        </g>
    </svg>

    <img src="svg.svg" alt="">
</body>

</html>
