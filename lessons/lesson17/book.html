<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f5f0e8;
        }

        .book {
            perspective: 1500px;
        }

        .item {
            position: relative;
            width: 300px;
            height: 300px;
            background-color: rgb(255, 170, 170);
            border-radius: 24px 36px 31px 22px;
            padding: 30px;
            text-shadow: 1px -3px 10px #00CE27;
            box-shadow: 11px -9px 12px -3px #0047FF;
            transform-origin: left center;
            transform-style: preserve-3d;
            animation: pageFlip 4s ease-in-out infinite;
            backface-visibility: hidden;
        }

        .item::after {
            content: "Обратная сторона страницы. Текст продолжается здесь, как в настоящей книге при перевороте листа.";
            position: absolute;
            inset: 0;
            padding: 30px;
            background-color: rgb(255, 220, 170);
            border-radius: 22px 31px 36px 24px;
            box-shadow: -11px -9px 12px -3px #0047FF;
            transform: rotateY(180deg);
            backface-visibility: hidden;
        }

        @keyframes pageFlip {
            0%,
            15% {
                transform: rotateY(0deg);
            }

            45%,
            55% {
                transform: rotateY(-180deg);
            }

            85%,
            100% {
                transform: rotateY(-360deg);
            }
        }
    </style>

</head>

<body>

    <div class="book">
        <div class="item">
            Lorem ipsum dolor sit amet consectetur adipisicing elit. Quo, laborum laudantium facere non quibusdam atque, ab
            dolores rerum nam natus quos molestias ut libero alias neque magnam voluptates deserunt ipsum.
        </div>
    </div>

</body>

</html>
