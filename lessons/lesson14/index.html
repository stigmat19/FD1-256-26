<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        body {
            height: 10000px;
        }
        
        .wrap {
            width: 200px;
            height: 200px;
            background-color: aqua;
            margin: 50px;
            position: relative;
            margin-bottom: 50px;
        }
        
        .item {
            width: 50px;
            height: 50px;
            position: absolute;
        }
        
        .item:first-child {
            background-color: red;
            left: 20px;
            top: 20px;
        }
        
        .item:nth-child(2) {
            background-color: blue;
            left: 40px;
            top: 40px;
        }
        
        .item:last-child {
            background-color: green;
            left: 60px;
            top: 60px;
            z-index: 10001;
        }
        
        .item:hover {
            z-index: 10000;
        }
    </style>

</head>

<body>
    <!-- <div class="wrap">
        <div class="item"></div>
        <div class="item"></div>
        <div class="item"></div>
    </div> -->

    <div style='position: absolute; left: 50px; top: 200px; z-index: 3; width: 300px; height: 300px; background-color: yellow'>
        <div style='position: absolute; left: 20px; top: 20px; z-index: -5; width: 50px; height: 50px; background-color: red'></div>
        <div style='position: absolute; left: 100px; top: 20px; z-index: 20; width: 50px; height: 50px; background-color: blue'></div>
    </div>
    <div style='position: absolute; left: 20px; top: 250px; z-index: 10; width: 300px; height: 300px; background-color: rgba(0,255,255,0.9)'></div>
</body>

</html>
